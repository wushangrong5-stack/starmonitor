<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>StarMonitor</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f7;color:#18181b;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{position:sticky;top:0;background:rgba(245,245,247,.92);backdrop-filter:blur(16px);border-bottom:1px solid #ddd;z-index:2}
.wrap{max-width:820px;margin:auto;padding:18px 16px}
h1{margin:0;font-size:28px}.sub{color:#71717a;margin-top:5px;font-size:14px}
.tabs{display:flex;gap:8px;margin-top:16px;overflow:auto}.tab{border:0;border-radius:999px;padding:9px 14px;background:#e4e4e7;font-weight:600;white-space:nowrap}.tab.active{background:#18181b;color:#fff}
button.refresh{border:0;border-radius:12px;padding:10px 14px;background:#18181b;color:#fff;margin-top:14px}
.status{font-size:13px;color:#71717a;margin-left:8px}.card{background:#fff;border:1px solid #e4e4e7;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 2px 8px #00000008}
.artist{font-size:14px;font-weight:700;color:#71717a}.title{font-size:18px;font-weight:700;margin:6px 0}.meta{font-size:13px;color:#71717a}.summary{line-height:1.6;margin:10px 0}.link{color:#2563eb;text-decoration:none;font-size:14px}
.empty{padding:50px 10px;text-align:center;color:#71717a}.hot{border-left:4px solid #18181b}.small{font-size:12px;color:#a1a1aa}
</style>
</head>
<body>
<header><div class="wrap">
<h1>StarMonitor</h1>
<div class="sub">Taylor Swift · Sabrina Carpenter 新闻监控</div>
<div class="tabs">
<button class="tab active" data-key="全部">全部</button>
<button class="tab" data-key="Taylor Swift">Taylor Swift</button>
<button class="tab" data-key="Sabrina Carpenter">Sabrina Carpenter</button>
</div>
<button class="refresh" onclick="loadNews(true)">刷新新闻</button><span class="status" id="status">准备中…</span>
</div></header>
<main class="wrap">
<section><h2>今日重点</h2><div id="hot"></div></section>
<section><h2>最新新闻</h2><div id="news"></div></section>
</main>
<script>
const demo=[
{artist:"Taylor Swift",source:"Billboard",title:"这里会显示 Taylor Swift 的最新新闻",summary:"部署后台后，这里会自动显示来自指定媒体和新闻源的中文摘要。",time:"等待数据",link:"#",hot:true},
{artist:"Sabrina Carpenter",source:"Variety",title:"这里会显示 Sabrina Carpenter 的最新新闻",summary:"网页本身已经准备好，连接后台后即可自动更新。",time:"等待数据",link:"#",hot:false}
];
let all=demo,filter="全部";
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function render(){
let arr=filter==="全部"?all:all.filter(x=>x.artist===filter);
document.getElementById("news").innerHTML=arr.length?arr.map(x=>`<article class="card ${x.hot?"hot":""}">
<div class="artist">${esc(x.artist)}</div><div class="title">${esc(x.title)}</div>
<div class="meta">${esc(x.source)} · ${esc(x.time)}</div>
<div class="summary">${esc(x.summary)}</div>
<a class="link" href="${esc(x.link)}" target="_blank" rel="noopener">查看原文 →</a></article>`).join(""):`<div class="empty">暂无新闻</div>`;
let hot=arr.filter(x=>x.hot);
document.getElementById("hot").innerHTML=hot.length?hot.map(x=>`<article class="card hot"><div class="artist">${esc(x.artist)}</div><div class="title">${esc(x.title)}</div><div class="summary">${esc(x.summary)}</div><a class="link" href="${esc(x.link)}" target="_blank">查看原文 →</a></article>`).join(""):`<div class="empty">今日暂无重点</div>`;
}
async function loadNews(manual=false){
document.getElementById("status").textContent="正在刷新…";
try{
const r=await fetch("/api/news",{cache:"no-store"});
if(!r.ok)throw new Error();
const data=await r.json(); if(Array.isArray(data))all=data;
document.getElementById("status").textContent="已更新 · "+new Date().toLocaleTimeString();
}catch(e){document.getElementById("status").textContent="演示数据 · 部署后台后自动更新"}
render();
}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");filter=b.dataset.key;render()});
render(); loadNews(); setInterval(()=>loadNews(),15*60*1000);
</script>
</body>
</html>
