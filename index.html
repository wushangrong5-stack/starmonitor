<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>明星新闻监控</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0d0e13;color:#f3f3f5;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
.wrap{max-width:900px;margin:auto;padding:28px 18px 50px}.top{padding:18px 0 24px;border-bottom:1px solid #292b34}
h1{font-size:30px;margin:0 0 8px}.sub{color:#9fa2ad;font-size:14px}.date{margin-top:12px;color:#c7c9d2}
section{margin-top:26px}.title{font-size:22px;font-weight:700;margin-bottom:12px}
.card{background:#15171e;border:1px solid #292c36;border-radius:14px;padding:16px;margin:10px 0}.card h3{font-size:17px;margin:0 0 8px;line-height:1.45}.card p{color:#b8bbc5;line-height:1.65;margin:0 0 10px;font-size:14px}.source{font-size:12px;color:#777b88}
.note{background:#12141a;border-left:3px solid #7c5cff;padding:12px 14px;border-radius:8px;color:#bfc2cd;line-height:1.6;font-size:14px}
footer{margin-top:35px;color:#666a76;font-size:12px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>明星新闻监控</h1>
    <div class="sub">Taylor Swift · Sabrina Carpenter</div>
    <div class="date">最后更新：等待自动更新</div>
  </div>

  <div class="note" style="margin-top:20px">
    这是新闻监控网页。新闻内容由自动化程序更新；本页面只展示摘要和来源，不转载完整文章。
  </div>

  <section>
    <div class="title">Taylor Swift</div>
    <div id="taylor">
      <div class="card"><h3>暂无今日新闻</h3><p>部署完成后，这里会显示最新新闻摘要。</p><div class="source">等待新闻源更新</div></div>
    </div>
  </section>

  <section>
    <div class="title">Sabrina Carpenter</div>
    <div id="sabrina">
      <div class="card"><h3>暂无今日新闻</h3><p>部署完成后，这里会显示最新新闻摘要。</p><div class="source">等待新闻源更新</div></div>
    </div>
  </section>

  <section>
    <div class="title">每日汇总</div>
    <div class="card"><h3>自动整理</h3><p>网页会按艺人分类展示新闻，并保留原始来源，方便查看。</p></div>
  </section>

  <footer>个人新闻监控页面 · 仅用于新闻整理与阅读</footer>
</div>
</body>
</html>
