<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taybrina监控 - 明星新闻动态</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            taylor: '#8b5cf6',
                            sabrina: '#ec4899',
                            dark: '#0f172a'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pb-12 font-sans antialiased selection:bg-indigo-500 selection:text-white">

    <!-- 顶部导航和页头 -->
    <header class="sticky top-0 z-50 backdrop-blur-md bg-slate-950/80 border-b border-slate-800">
        <div class="max-w-4xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
            <div>
                <div class="flex items-center gap-2">
                    <span class="inline-block w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></span>
                    <h1 class="text-xl sm:text-2xl font-bold tracking-tight text-white">Taybrina监控</h1>
                </div>
                <p class="text-xs sm:text-sm text-slate-400 mt-0.5">Taylor Swift · Sabrina Carpenter 每日新闻速递</p>
            </div>
            <div class="text-left sm:text-right">
                <span id="update-badge" class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium bg-slate-800 text-slate-300 border border-slate-700">
                    <svg class="w-3.5 h-3.5 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    <span id="update-time">读取中...</span>
                </span>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 pt-6 space-y-8">

        <!-- 顶部信息框 -->
        <div class="p-4 rounded-xl bg-gradient-to-r from-indigo-950/60 to-purple-950/60 border border-indigo-900/40 text-xs sm:text-sm text-slate-300 flex items-start gap-3 shadow-lg">
            <svg class="w-5 h-5 text-indigo-400 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <div class="space-y-1">
                <p class="font-medium text-slate-200">Taybrina 自动监控中心</p>
                <p class="text-slate-400">本页面新闻由 GitHub Actions 自动化程序每 6 小时自动抓取并整理更新。点击列表项可跳转阅读原文。</p>
            </div>
        </div>

        <!-- 搜索与筛选工具栏 -->
        <div class="flex flex-col sm:flex-row gap-3 justify-between items-center bg-slate-900/60 p-3 rounded-xl border border-slate-800">
            <!-- 切换标签 -->
            <div class="flex bg-slate-950 p-1 rounded-lg border border-slate-800/80 w-full sm:w-auto">
                <button onclick="filterArtist('all')" id="btn-all" class="flex-1 sm:flex-none px-4 py-1.5 rounded-md text-xs sm:text-sm font-medium transition bg-indigo-600 text-white shadow-sm">全部动态</button>
                <button onclick="filterArtist('Taylor Swift')" id="btn-taylor" class="flex-1 sm:flex-none px-4 py-1.5 rounded-md text-xs sm:text-sm font-medium transition text-slate-400 hover:text-white">Taylor Swift</button>
                <button onclick="filterArtist('Sabrina Carpenter')" id="btn-sabrina" class="flex-1 sm:flex-none px-4 py-1.5 rounded-md text-xs sm:text-sm font-medium transition text-slate-400 hover:text-white">Sabrina Carpenter</button>
            </div>

            <!-- 关键词搜索框 -->
            <div class="relative w-full sm:w-64">
                <input type="text" id="search-input" oninput="handleSearch()" placeholder="搜索新闻标题..." class="w-full bg-slate-950 border border-slate-800 rounded-lg pl-9 pr-3 py-1.5 text-xs sm:text-sm text-slate-200 focus:outline-none focus:border-indigo-500 transition placeholder:text-slate-500">
                <svg class="w-4 h-4 text-slate-500 absolute left-3 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            </div>
        </div>

        <!-- Taylor Swift 模块 -->
        <section id="section-taylor" class="space-y-4">
            <div class="flex items-center justify-between border-b border-slate-800/80 pb-2">
                <div class="flex items-center gap-2">
                    <div class="w-2.5 h-6 bg-purple-500 rounded-full"></div>
                    <h2 class="text-lg sm:text-xl font-bold text-slate-100">Taylor Swift</h2>
                </div>
                <span id="count-taylor" class="text-xs px-2 py-0.5 rounded bg-purple-950/80 border border-purple-800/50 text-purple-300 font-medium">0 条动态</span>
            </div>
            <div id="container-taylor" class="grid gap-3">
                <!-- 骨架屏加载 -->
                <div class="p-4 bg-slate-900/40 rounded-xl border border-slate-800/60 animate-pulse h-24"></div>
            </div>
        </section>

        <!-- Sabrina Carpenter 模块 -->
        <section id="section-sabrina" class="space-y-4 pt-4">
            <div class="flex items-center justify-between border-b border-slate-800/80 pb-2">
                <div class="flex items-center gap-2">
                    <div class="w-2.5 h-6 bg-pink-500 rounded-full"></div>
                    <h2 class="text-lg sm:text-xl font-bold text-slate-100">Sabrina Carpenter</h2>
                </div>
                <span id="count-sabrina" class="text-xs px-2 py-0.5 rounded bg-pink-950/80 border border-pink-800/50 text-pink-300 font-medium">0 条动态</span>
            </div>
            <div id="container-sabrina" class="grid gap-3">
                <!-- 骨架屏加载 -->
                <div class="p-4 bg-slate-900/40 rounded-xl border border-slate-800/60 animate-pulse h-24"></div>
            </div>
        </section>

        <!-- 无搜寻结果提示 -->
        <div id="empty-state" class="hidden text-center py-12 space-y-3">
            <svg class="w-12 h-12 text-slate-600 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z"></path></svg>
            <p class="text-slate-400 text-sm">未找到相关新闻内容</p>
        </div>

    </main>

    <footer class="max-w-4xl mx-auto px-4 mt-16 text-center text-xs text-slate-600">
        <p>Taybrina监控 · 个人自动新闻追踪站</p>
    </footer>

    <script>
        let rawNewsData = [];
        let currentFilter = 'all';

        async function fetchNews() {
            try {
                // 加时间戳防止浏览器强缓存 news.json
                const response = await fetch(`news.json?t=${new Date().getTime()}`);
                if (!response.ok) throw new Error("news.json 未生成");
                
                rawNewsData = await response.json();
                
                if (rawNewsData && rawNewsData.length > 0) {
                    document.getElementById('update-time').innerText = '最后更新: ' + new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                    renderAll();
                } else {
                    showNoData();
                }
            } catch (err) {
                console.warn("读取 news.json 失败或尚未抓取:", err);
                showNoData();
            }
        }

        function renderAll() {
            const searchQuery = document.getElementById('search-input').value.toLowerCase().trim();
            
            let filtered = rawNewsData.filter(item => {
                const matchesSearch = item.title.toLowerCase().includes(searchQuery) || (item.summary && item.summary.toLowerCase().includes(searchQuery));
                const matchesArtist = currentFilter === 'all' || item.artist === currentFilter;
                return matchesSearch && matchesArtist;
            });

            const taylorNews = filtered.filter(item => item.artist === 'Taylor Swift');
            const sabrinaNews = filtered.filter(item => item.artist === 'Sabrina Carpenter');

            const taylorContainer = document.getElementById('container-taylor');
            const sabrinaContainer = document.getElementById('container-sabrina');
            const sectionTaylor = document.getElementById('section-taylor');
            const sectionSabrina = document.getElementById('section-sabrina');
            const emptyState = document.getElementById('empty-state');

            // 控制模块显示隐藏
            if (currentFilter === 'Taylor Swift') {
                sectionTaylor.classList.remove('hidden');
                sectionSabrina.classList.add('hidden');
            } else if (currentFilter === 'Sabrina Carpenter') {
                sectionTaylor.classList.add('hidden');
                sectionSabrina.classList.remove('hidden');
            } else {
                sectionTaylor.classList.remove('hidden');
                sectionSabrina.classList.remove('hidden');
            }

            // 更新计数器
            document.getElementById('count-taylor').innerText = `${taylorNews.length} 条动态`;
            document.getElementById('count-sabrina').innerText = `${sabrinaNews.length} 条动态`;

            // 渲染列表
            renderList(taylorContainer, taylorNews);
            renderList(sabrinaContainer, sabrinaNews);

            if (filtered.length === 0) {
                emptyState.classList.remove('hidden');
            } else {
                emptyState.classList.add('hidden');
            }
        }

        function renderList(container, items) {
            if (items.length === 0) {
                container.innerHTML = `
                    <div class="p-4 bg-slate-900/30 rounded-xl border border-slate-800/50 text-slate-500 text-xs text-center">
                        暂无新闻数据
                    </div>
                `;
                return;
            }

            container.innerHTML = items.map(item => `
                <article class="p-4 bg-slate-900/80 hover:bg-slate-900 rounded-xl border border-slate-800/80 hover:border-slate-700 transition duration-150 shadow-sm flex flex-col justify-between space-y-3 group">
                    <div class="space-y-1.5">
                        <a href="${item.url}" target="_blank" rel="noopener noreferrer" class="font-semibold text-slate-100 group-hover:text-indigo-400 transition text-sm sm:text-base leading-snug block">
                            ${escapeHtml(item.title)}
                        </a>
                        ${item.summary ? `<p class="text-xs text-slate-400 line-clamp-2 leading-relaxed font-normal">${escapeHtml(item.summary)}</p>` : ''}
                    </div>
                    <div class="flex items-center justify-between text-[11px] text-slate-500 pt-1 border-t border-slate-800/40">
                        <span class="inline-flex items-center gap-1 bg-slate-950 px-2 py-0.5 rounded border border-slate-800 text-slate-400 font-medium">
                            ${escapeHtml(item.source || '新闻源')}
                        </span>
                        <span class="text-slate-500">${escapeHtml(item.time || '')}</span>
                    </div>
                </article>
            `).join('');
        }

        function filterArtist(artist) {
            currentFilter = artist;
            
            // 更新按钮样式
            const btnAll = document.getElementById('btn-all');
            const btnTaylor = document.getElementById('btn-taylor');
            const btnSabrina = document.getElementById('btn-sabrina');

            const activeClass = 'bg-indigo-600 text-white shadow-sm';
            const inactiveClass = 'text-slate-400 hover:text-white';

            btnAll.className = `flex-1 sm:flex-none px-4 py-1.5 rounded-md text-xs sm:text-sm font-medium transition ${artist === 'all' ? activeClass : inactiveClass}`;
            btnTaylor.className = `flex-1 sm:flex-none px-4 py-1.5 rounded-md text-xs sm:text-sm font-medium transition ${artist === 'Taylor Swift' ? activeClass : inactiveClass}`;
            btnSabrina.className = `flex-1 sm:flex-none px-4 py-1.5 rounded-md text-xs sm:text-sm font-medium transition ${artist === 'Sabrina Carpenter' ? activeClass : inactiveClass}`;

            renderAll();
        }

        function handleSearch() {
            renderAll();
        }

        function showNoData() {
            document.getElementById('update-time').innerText = '数据待更新';
            document.getElementById('container-taylor').innerHTML = `<div class="p-4 bg-slate-900/30 rounded-xl border border-slate-800/50 text-slate-400 text-xs text-center">暂无今日新闻</div>`;
            document.getElementById('container-sabrina').innerHTML = `<div class="p-4 bg-slate-900/30 rounded-xl border border-slate-800/50 text-slate-400 text-xs text-center">暂无今日新闻</div>`;
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        // 初始化加载数据
        fetchNews();
    </script>
</body>
</html>
